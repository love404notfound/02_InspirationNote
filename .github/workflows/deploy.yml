name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # peaceiris/actions-gh-pages 需要写入权限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0' # 您本地的 Node 版本
          cache: 'npm'

      - name: Set npm version
        run: npm install -g npm@11.6.2 # 替换为您本地的 npm 版本 (npm -v)

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build-only # 请确认 package.json 中的构建命令是否为 build-only

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
